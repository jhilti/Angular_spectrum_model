[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluid-elastic-asm"
version = "0.1.0"
description = "Exact angular-spectrum model for a fluid-elastic-plate-fluid ultrasound path"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = [
    "streamlit>=1.60,<2",
    "plotly>=6,<7",
]

[project.scripts]
asm-pp-case = "angular_spectrum.cli:main"
asm-dmso-sweep = "angular_spectrum.dmso_sweep:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
